<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Keuangan - KAI Financial Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kai: {
                            navy: '#002B49',
                            blue: '#0D47A1',
                            orange: '#ED6B23',
                            bg: '#F4F6F9'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-kai-bg font-sans min-h-screen text-slate-800 pb-20 md:pb-0">

    <!-- HEADER -->
    <header class="bg-kai-navy text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-white text-lg"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="flex items-center space-x-2">
                    <div class="bg-kai-orange text-white font-extrabold px-2 py-0.5 rounded text-sm">KAI</div>
                    <span class="font-bold text-sm tracking-wide">Catatan Keuangan</span>
                </div>
            </div>
        </div>
    </header>

    <div class="flex max-w-7xl mx-auto">
        <!-- SIDEBAR (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 bg-kai-navy text-white min-h-screen p-4 justify-between">
            <div class="space-y-6">
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50 flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-kai-orange flex items-center justify-center font-bold text-white shadow">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400">Modul System</p>
                        <p class="text-sm font-bold text-white">Buku Kas</p>
                    </div>
                </div>
                <nav class="space-y-1">
                    <a href="index.html" class="flex items-center space-x-3 text-slate-300 hover:bg-white/5 hover:text-white px-4 py-3 rounded-xl font-medium text-sm transition">
                        <i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span>
                    </a>
                    <a href="keuangan.html" class="flex items-center space-x-3 bg-kai-blue text-white px-4 py-3 rounded-xl font-medium text-sm shadow">
                        <i class="fa-solid fa-wallet w-5"></i><span>Catatan Keuangan</span>
                    </a>
                    <a href="tabungan.html" class="flex items-center space-x-3 text-slate-300 hover:bg-white/5 hover:text-white px-4 py-3 rounded-xl font-medium text-sm transition">
                        <i class="fa-solid fa-piggy-bank w-5"></i><span>Target Tabungan</span>
                    </a>
                    <a href="wishlist.html" class="flex items-center space-x-3 text-slate-300 hover:bg-white/5 hover:text-white px-4 py-3 rounded-xl font-medium text-sm transition">
                        <i class="fa-solid fa-heart w-5"></i><span>Wishlist Impian</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 md:p-6 space-y-4 max-w-2xl mx-auto">
            <!-- Balance Card KAI Theme -->
            <div class="bg-gradient-to-r from-kai-navy to-kai-blue p-5 rounded-2xl shadow-lg text-white">
                <p class="text-xs uppercase tracking-wider text-slate-300">Total Saldo Aktif</p>
                <h2 id="totalBalance" class="text-3xl font-extrabold mt-1">Rp 0</h2>
                
                <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-white/20">
                    <div>
                        <p class="text-[11px] uppercase text-emerald-300"><i class="fa-solid fa-arrow-down"></i> Pemasukan</p>
                        <p id="totalIncome" class="font-bold text-sm text-emerald-200">Rp 0</p>
                    </div>
                    <div>
                        <p class="text-[11px] uppercase text-kai-orange"><i class="fa-solid fa-arrow-up"></i> Pengeluaran</p>
                        <p id="totalExpense" class="font-bold text-sm text-orange-200">Rp 0</p>
                    </div>
                </div>
            </div>

            <!-- Form Transaksi -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="text-sm font-bold text-kai-navy">Tambah Record Transaksi</h3>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="desc" placeholder="Keterangan (misal: Gaji, Tiket, Makan)" class="col-span-2 bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 focus:outline-none focus:border-kai-blue">
                    <input type="number" id="amount" placeholder="Nominal (Rp)" class="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 focus:outline-none focus:border-kai-blue">
                    <select id="type" class="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 focus:outline-none focus:border-kai-blue">
                        <option value="in">Pemasukan (+)</option>
                        <option value="out">Pengeluaran (-)</option>
                    </select>
                </div>
                <button onclick="addTransaction()" class="w-full bg-kai-orange hover:bg-kai-orangeHover text-white font-bold text-xs py-2.5 rounded-lg transition-all shadow">Simpan Transaksi</button>
            </div>

            <!-- Histori Transaksi -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-kai-navy mb-3">Histori Transaksi</h3>
                <div id="txList" class="space-y-2">
                    <!-- Dynamic -->
                </div>
            </div>
        </main>
    </div>

    <!-- BOTTOM MOBILE NAVIGATION -->
    <div class="fixed bottom-0 left-0 right-0 bg-kai-navy text-white border-t border-slate-700 py-2.5 z-40 md:hidden">
        <div class="grid grid-cols-4 text-center">
            <a href="index.html" class="text-slate-300 hover:text-white flex flex-col items-center gap-1 text-[11px]">
                <i class="fa-solid fa-chart-pie text-base"></i> Home
            </a>
            <a href="keuangan.html" class="text-kai-orange flex flex-col items-center gap-1 text-[11px] font-bold">
                <i class="fa-solid fa-wallet text-base"></i> Keuangan
            </a>
            <a href="tabungan.html" class="text-slate-300 hover:text-white flex flex-col items-center gap-1 text-[11px]">
                <i class="fa-solid fa-piggy-bank text-base"></i> Tabungan
            </a>
            <a href="wishlist.html" class="text-slate-300 hover:text-white flex flex-col items-center gap-1 text-[11px]">
                <i class="fa-solid fa-heart text-base"></i> Wishlist
            </a>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('app_tx')) || [];

        function formatRp(num) {
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function render() {
            const list = document.getElementById('txList');
            list.innerHTML = '';

            let income = 0;
            let expense = 0;

            if (transactions.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada transaksi recorded.</p>`;
            }

            transactions.forEach((item, index) => {
                if (item.type === 'in') income += item.amount;
                if (item.type === 'out') expense += item.amount;

                const card = document.createElement('div');
                card.className = 'flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs';
                card.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${item.type === 'in' ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-kai-orange'}">
                            <i class="fa-solid ${item.type === 'in' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800">${item.desc}</p>
                            <p class="text-[10px] text-slate-400">${item.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold ${item.type === 'in' ? 'text-emerald-600' : 'text-kai-orange'}">
                            ${item.type === 'in' ? '+' : '-'} ${formatRp(item.amount)}
                        </span>
                        <button onclick="deleteTx(${index})" class="text-slate-400 hover:text-rose-500">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('totalIncome').innerText = formatRp(income);
            document.getElementById('totalExpense').innerText = formatRp(expense);
            document.getElementById('totalBalance').innerText = formatRp(income - expense);

            localStorage.setItem('app_tx', JSON.stringify(transactions));
        }

        function addTransaction() {
            const desc = document.getElementById('desc').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            if (!desc || isNaN(amount) || amount <= 0) {
                alert('Mohon isi keterangan dan nominal dengan benar.');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;

            transactions.unshift({ desc, amount, type, date: dateStr });
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            render();
        }

        function deleteTx(index) {
            if (confirm('Hapus transaksi ini?')) {
                transactions.splice(index, 1);
                render();
            }
        }

        render();
    </script>
</body>
</html>
