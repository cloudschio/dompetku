<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance - Tabungan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-24">

    <!-- Header Gradient -->
    <div class="bg-gradient-to-b from-blue-600 to-sky-400 pt-8 pb-10 px-5 rounded-b-[2.5rem] shadow-sm text-white">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-lg font-bold">Kantong Tabungan</h1>
            <button class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>
        <p class="text-xs text-sky-100">Total simpanan terkumpul dari semua kantong</p>
        <h2 class="text-3xl font-extrabold mt-1">Rp 8.500.000</h2>
    </div>

    <!-- Savings Cards List -->
    <div class="px-5 mt-6 space-y-4">

        <!-- Pocket 1 -->
        <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-800">Dana Darurat</h3>
                        <p class="text-[10px] text-slate-400">Target: Rp 10.000.000</p>
                    </div>
                </div>
                <span class="text-xs font-bold text-sky-600">60%</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mb-3">
                <div class="bg-gradient-to-r from-blue-500 to-sky-400 h-full rounded-full" style="width: 60%"></div>
            </div>

            <div class="flex justify-between items-center text-xs">
                <span class="text-slate-400 font-medium">Terkumpul</span>
                <span class="font-bold text-slate-700">Rp 6.000.000</span>
            </div>
        </div>

        <!-- Pocket 2 -->
        <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center">
                        <i data-lucide="plane" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-800">Liburan Akhir Tahun</h3>
                        <p class="text-[10px] text-slate-400">Target: Rp 5.000.000</p>
                    </div>
                </div>
                <span class="text-xs font-bold text-indigo-600">50%</span>
            </div>

            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mb-3">
                <div class="bg-gradient-to-r from-indigo-500 to-sky-400 h-full rounded-full" style="width: 50%"></div>
            </div>

            <div class="flex justify-between items-center text-xs">
                <span class="text-slate-400 font-medium">Terkumpul</span>
                <span class="font-bold text-slate-700">Rp 2.500.000</span>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-t border-slate-200/80 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Keuangan</span>
            </a>
            <a href="tabungan.html" class="flex flex-col items-center gap-1 text-sky-600">
                <i data-lucide="piggy-bank" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Tabungan</span>
            </a>
            <a href="wishlist.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Wishlist</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
