<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance - Wishlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-24">

    <!-- Header Gradient -->
    <div class="bg-gradient-to-b from-blue-600 to-sky-400 pt-8 pb-10 px-5 rounded-b-[2.5rem] shadow-sm text-white">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">Wishlist Impian</h1>
                <p class="text-xs text-sky-100 mt-1">Rencanakan barang impianmu di sini</p>
            </div>
            <button class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- Wishlist Cards Grid -->
    <div class="px-5 mt-6 space-y-4">

        <!-- Wishlist Item 1 -->
        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4">
            <div class="w-16 h-16 rounded-2xl bg-sky-50 text-sky-500 flex items-center justify-center flex-shrink-0">
                <i data-lucide="laptop" class="w-8 h-8"></i>
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h3 class="text-xs font-bold text-slate-800">Laptop Workstation</h3>
                    <span class="px-2 py-0.5 bg-amber-50 text-amber-600 rounded-full text-[9px] font-bold">Proses</span>
                </div>
                <p class="text-xs font-bold text-sky-600 mt-1">Rp 18.000.000</p>
                <div class="w-full bg-slate-100 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div class="bg-sky-500 h-full rounded-full" style="width: 35%"></div>
                </div>
            </div>
        </div>

        <!-- Wishlist Item 2 -->
        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4">
            <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center flex-shrink-0">
                <i data-lucide="smartphone" class="w-8 h-8"></i>
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h3 class="text-xs font-bold text-slate-800">Smartphone Baru</h3>
                    <span class="px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded-full text-[9px] font-bold">Tercapai</span>
                </div>
                <p class="text-xs font-bold text-sky-600 mt-1">Rp 7.500.000</p>
                <div class="w-full bg-slate-100 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div class="bg-emerald-500 h-full rounded-full" style="width: 100%"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-t border-slate-200/80 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Keuangan</span>
            </a>
            <a href="tabungan.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors">
                <i data-lucide="piggy-bank" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Tabungan</span>
            </a>
            <a href="wishlist.html" class="flex flex-col items-center gap-1 text-sky-600">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Wishlist</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
